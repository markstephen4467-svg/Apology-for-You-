<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>I'm Sorry Deepali ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(270deg, #ff758c, #ff7eb3, #fad0c4);
    background-size: 600% 600%;
    animation: gradient 12s ease infinite;
    overflow: hidden;
    text-align: center;
    color: white;
}

@keyframes gradient {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.container {
    margin-top: 100px;
    padding: 20px;
}

h1 {
    font-size: 42px;
    animation: fadeIn 2s ease;
}

p {
    font-size: 22px;
    animation: fadeIn 4s ease;
    line-height: 1.6;
}

button {
    padding: 14px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    background: white;
    color: #ff4d6d;
    cursor: pointer;
    margin-top: 25px;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.15);
}

#response {
    margin-top: 20px;
    font-size: 24px;
}

@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}

.heart {
    position: absolute;
    color: red;
    font-size: 20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% {
        transform: translateY(100vh);
        opacity: 1;
    }
    100% {
        transform: translateY(-10vh);
        opacity: 0;
    }
}
</style>

</head>
<body>

<!-- YouTube Music Embed (hidden player) -->
<iframe width="0" height="0"
src="https://www.youtube.com/embed/9xwazD5SyVg?autoplay=1&loop=1&playlist=9xwazD5SyVg"
frameborder="0"
allow="autoplay">
</iframe>

<div class="container">

<h1>I'm Sorry, Deepali ❤️</h1>

<p>
I'm sorry my love for not attending your message last night 😔<br><br>

</p>

<button onclick="forgive()">Click here if you forgive me 💖</button>

<div id="response"></div>

</div>

<script>
function forgive() {
    document.getElementById("response").innerHTML =
    "Thank you Deepali ❤️ You made me the happiest person 🥹 I love you forever 💕";
}

// Floating hearts
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 25 + 15) + "px";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}, 300);
</script>

</body>
  </html>
